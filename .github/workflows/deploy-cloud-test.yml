name: Release default cloud test environment

on:
  push:
    branches: [feat/cloud-container-p1]

permissions: {}

jobs:
  checks:
    if: github.repository == 'nexu-io/openmotion'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  images:
    if: github.repository == 'nexu-io/openmotion'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/container-images.yml

  promote:
    name: Publish tested image digests for Argo CD
    needs: [checks, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Advance the default test release
        run: bash .github/scripts/promote-cloud-test.sh "$RUNNER_TEMP/digests"
