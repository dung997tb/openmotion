appId: io.nexu.openmotion.desktop
productName: OpenDesign
copyright: Copyright © OpenDesign Contributors
artifactName: OpenDesign-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

protocols:
  - name: OpenDesign
    schemes:
      - openmotion

mac:
  category: public.app-category.video
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenDesign

publish:
  provider: generic
  url: https://releases.open-design.ai/open-motion/desktop/stable
  channel: stable
