apiVersion: v1
kind: Namespace
metadata:
  name: openmotion
  labels:
    app.kubernetes.io/part-of: openmotion
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmotion-api
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-api
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmotion-worker-media
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-worker-media
    app.kubernetes.io/component: worker-media
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmotion-worker-render
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-worker-render
    app.kubernetes.io/component: worker-render
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmotion-jobs
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-jobs
    app.kubernetes.io/component: jobs
automountServiceAccountToken: false
