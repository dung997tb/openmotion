apiVersion: batch/v1
kind: Job
metadata:
  name: openmotion-db-migrate
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-db-migrate
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: openmotion
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmotion-db-migrate
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: openmotion
    spec:
      serviceAccountName: openmotion-jobs
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/nexu-io/openmotion-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "--experimental-strip-types", "src/db/migrate.ts"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
